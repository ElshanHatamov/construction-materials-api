spring:
  application:
    name: construction-materials-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/constructiondb}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080