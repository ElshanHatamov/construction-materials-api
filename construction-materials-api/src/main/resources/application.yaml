spring:
  application:
    name: construction-materials-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/constructiondb}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080